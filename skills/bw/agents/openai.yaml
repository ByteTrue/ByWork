interface:
  display_name: "ByWork"
  short_description: "用检查点、验证证据与现行决定管理长会话和长期项目"
  default_prompt: |
    使用 $bw 先判断当前动作（理解、澄清、方案、实现、证明、收尾、审查、记忆），只读取该动作对应的必读规则。
    跨轮次或多步骤工作在 bywork/proposed/<分类>/yyyy-mm-dd-topic.md 立项并按验收标准表逐项推进；收尾时通过 scripts/bw.py 转为 implemented/ 或 rejected/；已实施且不再指导当前工作的记录可归档。
    每次回复末尾输出「做了什么 / 下一步 / 需要你」三段收尾总结。